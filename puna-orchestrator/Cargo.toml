[package]
name = "puna-orchestrator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
puna-core.workspace = true

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

diesel.workspace = true
diesel-async.workspace = true

# axum rather than Rocket for /healthz, /readyz and /metrics: three endpoints, and the
# orchestrator has no business acquiring a figment, a config file or a secret key.
axum = "0.8"

# default-features = false drops the openssl-backed TLS stack, so the debian:13-slim runtime
# image needs nothing but ca-certificates. "ring" must be stated explicitly: kube exposes the
# crypto provider as its own feature, and disabling defaults drops it, which would otherwise
# leave kube-client's hyper-rustls to fall back to aws-lc-rs.
kube = { version = "2", default-features = false, features = [
    "client",
    "rustls-tls",
    "ring",
    "runtime",
] }
# Pinned to the RKE2 minor actually running: v1.34.10+rke2r1, verified against the live cluster.
# A mismatch surfaces as missing struct fields rather than a build error, so it is worth stating.
k8s-openapi = { version = "0.26", features = ["v1_34"] }
