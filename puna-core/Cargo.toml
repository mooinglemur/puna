[package]
name = "puna-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# puna-core deliberately depends on NEITHER `kube` NOR `rocket`.
#
# That is the compile-time half of the tier split. The web tier cannot reach the Kubernetes
# client because the crate that would hand it over is not in its dependency graph; the missing
# ServiceAccount token on the pod is the deployment half of the same property. Adding `kube`
# here would quietly dissolve it, so this comment is the guard.
[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
deadpool.workspace = true
diesel.workspace = true
diesel-async.workspace = true
diesel_migrations.workspace = true
futures-util.workspace = true
pahoa-multidata.workspace = true
prometheus.workspace = true
prometheus-parse.workspace = true
# Already in the graph via rocket_oauth2 and uuid; named here because `secret.rs` depends on it
# being a CSPRNG, which is a property of `rand`'s default `ThreadRng` and not of "some rand crate".
rand = "0.8"
# The orchestrator's probe dials rooms over pahoa's own TLS. See the workspace declaration for
# why the feature list is not restated here.
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tracing.workspace = true
uuid.workspace = true
zip = "7"

[dev-dependencies]
# Already a normal dependency above, repeated here because integration tests are SEPARATE crates:
# they link against puna-core's public API and cannot reach its private dependency graph. The
# ingest test needs it to read slot types straight out of a real multidata.
pahoa-multidata.workspace = true
# Content-addressed promotion is filesystem behavior -- atomic rename, EEXIST as success, fsync
# ordering -- so it is tested against a real filesystem rather than a trait. One temp dir per test
# keeps them parallel-safe, the same shape as the database-per-test harness.
tempfile = "3"
zip = "7"
