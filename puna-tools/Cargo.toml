[package]
name = "puna-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Development tools, and deliberately NOT a tier.
#
# Nothing here is deployed: `.gitlab-ci.yml` builds the release images with `--bin puna-web` and
# `--bin puna-orchestrator` by name, so a member added to the workspace is never compiled into
# either. What it does get is `cargo clippy --workspace --all-targets -- -D warnings` and
# `cargo test --workspace`, which is the point -- the pickle writer below is a format
# implementation and deserves the same bar as the rest of the repository.
#
# It also deliberately does NOT depend on `puna-core`. These tools speak to a ROOM, not to Puna,
# and the one thing they share with the web tier -- how to read a multidata -- they get from the
# same upstream crate rather than through Puna's own wrapper.

[[bin]]
name = "make-generation"
path = "src/bin/make_generation.rs"

[[bin]]
name = "room-load"
path = "src/bin/room_load.rs"

[dependencies]
anyhow.workspace = true
# The untyped pickle layer, for BUILDING a tree the writer then serializes. Pinned to the same rev
# as `pahoa-multidata` in the workspace manifest; see the note there.
pahoa-pickle.workspace = true
# The seed READER, so the load generator learns slot names, games and location ids from exactly the
# parser Puna and pahoa use. A second reader here would be a second thing to keep in step with a
# format neither of us owns.
pahoa-multidata.workspace = true
# The WebSocket client, for the same reason and a sharper one: it is the only implementation that
# negotiates permessage-deflate with a pahoa room, which is what makes a load run's outbound numbers
# resemble real players rather than the worst case. pahoa made `Client` generic over its stream at
# our ask, so a TLS session built here can be handed straight to it.
pahoa-net.workspace = true
rand = "0.8"
# TLS, which this crate now terminates itself rather than having a WebSocket crate do it: `Client`
# takes the stream, so SNI, verification and the `Host:` header are decided here.
#
# **`rustls` is also what turns `ring` on**, and that is not incidental. This crate deliberately
# does not depend on `puna-core`, which is what enables `rustls/ring` everywhere else; features
# unify across the graph of the package being BUILT, so rustls compiled for these binaries once had
# no provider at all and `ClientConfig::builder()` panicked at the first `wss://` connection.
#
# The repository's `grep -c 'name = "aws-lc' Cargo.lock` check is necessary and NOT sufficient: it
# proves no SECOND provider, and says nothing about whether a first one exists. See
# `room_load`'s startup, which installs it explicitly as well, and the test in `load.rs`.
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The trust anchors. A room's certificate is a public Let's Encrypt one issued for its advertised
# name, so the webpki bundle is the right store and needs no host configuration.
webpki-roots = "1"
serde.workspace = true
serde_json.workspace = true
# The datapackage checksum, which upstream computes as sha1 over the package's canonical JSON. Not
# a security hash and not chosen as one -- it is the algorithm Archipelago already uses, and a
# client that finds no checksum never asks for names at all. Already in the lock under `kube`.
sha1 = "0.10"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "signal",
    # The TCP half of a connection this crate now opens itself.
    "net",
    "io-util",
] }
tracing.workspace = true
tracing-subscriber.workspace = true
zip = "7"
# zlib, which is what wraps the pickle inside a `.archipelago`. Already in the graph under `zip`
# and `pahoa-multidata`; named here because this crate calls it directly.
flate2 = "1"
