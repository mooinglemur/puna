# Image build pipeline for puna.
#
# Two binaries, two images:
#   - puna-web          : the web tier AND the tracker tier (PUNA_ROLE selects which)
#   - puna-orchestrator : the Kubernetes-facing singleton
#
# Pattern per binary, mirroring Archipelago-lobby's pipeline: a cargo job builds in a rust
# image with a cached crate registry, stages the binary as `build-result` next to its
# Dockerfile, then a buildah job builds that context. The Dockerfiles expect `build-result`
# and need no knowledge of CI.
#
# Images are built on every branch and always pushed as :sha-<short sha>. Moving tags are
# branch-gated: main pushes :latest, ionium-dev pushes :dev, other branches get no moving tag.
# Puna's manifests pin sha- tags exclusively, so git says what is running.
#
# DEPARTURE FROM THE LOBBY'S PIPELINE: this one runs `cargo test` and `cargo clippy -D warnings`
# as a gating job. The lobby builds only. Puna's port allocator, room state machine and
# authorization matrix are exactly the code where a silent regression is expensive and invisible
# until it matters, so they are checked on every push rather than trusted to review.
#
# Every job's `changes:` filter includes .gitlab-ci.yml -- the build recipe itself. Otherwise a
# fix to this file can only be deployed via a manual web-triggered run.

# Only run on the canonical GitLab instance. On a fork, mirror or other instance, no pipeline.
workflow:
  rules:
    - if: '$CI_SERVER_HOST == "git.mooinglemur.com"'

default:
  interruptible: true

stages:
  - check
  - rust-build
  - image

# ---- shared anchors ----

# THE REGISTRY ONLY, deliberately not `target/`.
#
# Caching `target/` looks like the obvious win and is not one here. The directory runs to gigabytes
# for this workspace, and GitLab's cache is not a mounted volume -- it is zipped, uploaded,
# downloaded and unpacked around every job. That round trip costs more wall-clock than the compile
# it saves, and it costs it on every job rather than only on the ones that would have rebuilt.
#
# It is also the cache most likely to be WRONG rather than merely slow: a stale `target/` keyed by
# branch is how a job passes against object files from a commit nobody is looking at.
#
# Downloading crates is the part actually worth keeping, so that is what stays.
.rust-cache: &rust-cache
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo

# Resource overrides for the jobs that actually compile. Values taken from pahoa's pipeline, whose
# workspace and toolchain are the same shape.
#
# --- CPU REQUEST == LIMIT, and that is the point rather than tidiness ------------------------------
# cargo picks its default job count from `available_parallelism()`, which respects the cgroup CPU
# QUOTA -- and the quota comes from the limit, not the request. So a pod with a small default quota
# builds at that many jobs no matter how big the node is: **the limit IS the build's parallelism.**
# Setting the request to match is what stops the scheduler overcommitting a node with jobs that will
# each genuinely use eight.
#
# Memory is request 4Gi / limit 6Gi: the peak is linking test binaries, and the headroom is so the
# tree can grow without OOM-killing mid-link rather than to be used routinely.
#
# --- THESE DO NOTHING UNLESS THE RUNNER ALLOWS IT ---------------------------------------------------
# The runner's config.toml needs the matching `cpu_request_overwrite_max_allowed`,
# `cpu_limit_overwrite_max_allowed` and the two memory equivalents under `[runners.kubernetes]`, set
# at least this high. Without them the values are silently ignored and jobs run at the runner's
# defaults -- which looks exactly like this block not existing.
#
# Merged INTO each job's `variables:` map rather than set on a job anchor, because a job that
# declares its own `variables:` REPLACES an inherited one wholesale -- YAML's `<<` does not deep-merge.
# That is also why CARGO_HOME is repeated everywhere it appears in this file.
.k8s-resources: &k8s-resources
  KUBERNETES_CPU_REQUEST: "8"
  KUBERNETES_CPU_LIMIT: "8"
  KUBERNETES_MEMORY_REQUEST: "4Gi"
  KUBERNETES_MEMORY_LIMIT: "6Gi"

.rust-env: &rust-env
  # Matches rust-toolchain.toml. The image tag and that file must move together: the toolchain
  # file wins, so a stale image only wastes a rustup download rather than building the wrong thing.
  image: rust:1.95-trixie
  tags:
    - linux
    - k8s
  before_script:
    # libpq-dev is NOT needed to build the workspace -- Postgres is reached via
    # diesel-async -> tokio-postgres, pure Rust. It is here for `diesel_cli`, which the
    # schema-drift job (M1) links against libpq. Keep them together so removing one does not
    # silently break the other.
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libpq-dev git ca-certificates mold
    - rm -rf /var/lib/apt/lists/*
  <<: *rust-cache

.buildah-build: &buildah-build
  stage: image
  image: quay.io/buildah/stable
  tags:
    - linux
    - k8s
  variables:
    CONTAINERS_STORAGE_CONF: /tmp/storage.conf
  before_script:
    # Native kernel overlay. The image's storage.conf sets mount_program = fuse-overlayfs, but
    # FUSE needs CAP_SYS_ADMIN, which this tier lacks. Dropping mount_program lets buildah mount
    # overlay directly. Must be a config file via $CONTAINERS_STORAGE_CONF, not
    # `--storage-driver overlay`: containers-storage persists driver options into the graphroot
    # on first use, so the flag inherits mount_program anyway. Copied from the lobby's pipeline,
    # where this was worked out the hard way.
    - |
      cat > "$CONTAINERS_STORAGE_CONF" <<'CONF'
      [storage]
      driver = "overlay"
      runroot = "/var/run/containers/storage"
      graphroot = "/var/lib/containers/storage"
      [storage.options.overlay]
      mountopt = "nodev"
      CONF
    # GraphOptions shows whether the config won: overlay.mountopt=nodev alone is right, a
    # mount_program entry means it did not. Falling back to vfs is slow, not broken.
    - buildah info
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      case "$CI_COMMIT_BRANCH" in
        main)        MOVING_TAG=latest ;;
        ionium-dev)  MOVING_TAG=dev ;;
        *)           MOVING_TAG= ;;
      esac
      echo "branch=$CI_COMMIT_BRANCH moving tag=${MOVING_TAG:-<none>}"
      # Tagged after the build so both names are guaranteed to be the same image.
      push_image() {
        buildah push "$1:sha-$CI_COMMIT_SHORT_SHA"
        if [ -n "$MOVING_TAG" ]; then
          buildah tag "$1:sha-$CI_COMMIT_SHORT_SHA" "$1:$MOVING_TAG"
          buildah push "$1:$MOVING_TAG"
        fi
      }

.always: &always
  rules:
    # **Not on a schedule.** A scheduled pipeline exists to run `flake-hunt` and nothing else, and
    # without this every job here would join it: a nightly would rebuild both binaries and re-push
    # both images -- including the moving `:latest` tag -- for a commit that has not changed.
    #
    # The waste is the smaller half. The real cost is that re-pushing `:latest` breaks the check
    # used before pinning an image: compare the `Docker-Content-Digest` of `sha-<short sha>` against
    # `:latest`, and equality means that tag is what CI actually built for that commit. A nightly
    # rebuild can move `:latest` to a different digest for the same sha, so the comparison starts
    # answering a question nobody asked.
    #
    # It must come FIRST -- GitLab takes the first matching rule, and `$CI_COMMIT_BRANCH` is set on
    # a scheduled pipeline too, so put after it this would never be reached.
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ---- check stage ----

check:
  <<: *rust-env
  <<: *always
  stage: check
  services:
    - name: docker.io/library/postgres:17
      alias: postgres
      variables:
        POSTGRES_USER: puna
        POSTGRES_PASSWORD: puna
        POSTGRES_DB: puna
  variables:
    <<: *k8s-resources
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    DATABASE_URL: postgres://puna:puna@postgres:5432/puna
    # The Postgres-backed tests SKIP (reporting ok) when DATABASE_URL is unset. This turns that
    # skip into a failure, so losing the service definition cannot quietly drop the coverage
    # while leaving the pipeline green.
    PUNA_REQUIRE_DB_TESTS: "1"
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings
    - cargo test --workspace

# schema.rs is generated and checked in. This asserts the committed copy still matches what the
# migrations produce, so a migration edited without regenerating cannot merge.
#
# diesel_cli links libpq (which Puna itself does not -- it reaches Postgres through
# diesel-async -> tokio-postgres, pure Rust), hence libpq-dev in the shared before_script.
schema-drift:
  <<: *rust-env
  <<: *always
  stage: check
  services:
    - name: docker.io/library/postgres:17
      alias: postgres
      variables:
        POSTGRES_USER: puna
        POSTGRES_PASSWORD: puna
        POSTGRES_DB: puna
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    DATABASE_URL: postgres://puna:puna@postgres:5432/puna
  script:
    # CARGO_HOME is redirected into the project directory so cargo's registry can be cached, and
    # that moves the install root with it: `cargo install` writes to $CARGO_HOME/bin, which is NOT
    # the image's /usr/local/cargo/bin and is not on PATH. Without this, diesel installs fine and
    # then the next line is `diesel: command not found`.
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install diesel_cli --no-default-features --features postgres --locked
    # Capture the COMMITTED schema before diesel can touch the working tree.
    #
    # This ordering is the whole check. `diesel migration run` REGENERATES
    # puna-core/src/schema.rs in place, because diesel.toml sets print_schema.file -- verified by
    # putting a marker line in the file and watching it disappear. So comparing the on-disk file
    # against `print-schema` output compares two freshly generated files, which are identical by
    # construction: the job passes unconditionally and asserts nothing.
    - git show HEAD:puna-core/src/schema.rs > /tmp/schema.committed.rs
    - diesel migration run --migration-dir puna-core/migrations
    - diesel print-schema > /tmp/schema.generated.rs
    # `diff` rather than `git diff --exit-code` so the failure prints exactly which lines drifted.
    - |
      if ! diff -u /tmp/schema.committed.rs /tmp/schema.generated.rs; then
        echo
        echo "puna-core/src/schema.rs is out of date with the migrations."
        echo "Regenerate it -- see the instructions at the top of diesel.toml -- and commit."
        exit 1
      fi
    - echo "schema.rs matches the migrations"

# Runs the whole suite many times over, looking for tests that fail intermittently.
#
# --- WHY THIS EXISTS ------------------------------------------------------------------------------
# Two flaky tests have been found in this repository, both by hand, both only because somebody
# happened to run the suite dozens of times in a row:
#
#   * `the_capability_gauge_...` raced another test that reseeded the same process-global metrics
#     registry without taking the shared mutex. Measured at 2 failures in 60.
#   * `a_reservation_outside_the_range_is_never_handed_back` built its port window relative to a
#     port the allocator picks at RANDOM (`ORDER BY last_activity, random()`, and on a fresh
#     database every pair ties), so roughly one run in eight the window fell outside the seeded
#     rows. Measured at 5 in 40.
#
# Neither is visible in a single run, and both are worse than a plain failure: a pipeline that goes
# green on a re-run is one people learn to re-run rather than diagnose.
#
# --- WHY IT REPORTS A RATE RATHER THAN STOPPING AT THE FIRST FAILURE -------------------------------
# "5 in 40" is the diagnosis. It is what distinguishes a 12% race from a 3% one, which is what tells
# you how many runs an A/B of a candidate fix needs to mean anything -- and both flakes above were
# confirmed fixed by exactly that comparison. Stopping early would throw that away to save minutes
# on a job that runs while everyone is asleep.
#
# --- THE WHOLE WORKSPACE, AT THE DEFAULT PARALLELISM ----------------------------------------------
# Not just the Postgres-backed suites. The metrics race needed *other tests in flight* to lose --
# running the suspect module alone showed 0 failures in 40 -- so anything that narrows the run or
# serializes it would have missed the one flake we already know the shape of.
#
# --- THIS JOB CAN SILENTLY NEVER RUN, WHICH IS THE HAZARD IT IS ITSELF SUBJECT TO -----------------
# `$CI_PIPELINE_SOURCE == "schedule"` requires a pipeline schedule to exist under
# CI/CD > Schedules in GitLab. **There is no way to declare one from this file.** With no schedule
# the job never runs, and a job that never runs looks exactly like a job that always passes.
# If nothing here has failed in months, check that a nightly schedule on `main` still exists before
# concluding the suite is stable.
#
# `interruptible: false` overrides the default for the same reason: GitLab cancels redundant
# pipelines on a ref, and a push to main part-way through would otherwise quietly kill the night's
# run and leave the same false all-clear.
#
# Run it on demand from CI/CD > Run pipeline, optionally with FLAKE_HUNT_RUNS set higher when
# hunting something specific -- 50 runs is a night's default, not a number worth trusting for a
# flake below a few percent.
flake-hunt:
  <<: *rust-env
  stage: check
  interruptible: false
  timeout: 1h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  services:
    - name: docker.io/library/postgres:17
      alias: postgres
      variables:
        POSTGRES_USER: puna
        POSTGRES_PASSWORD: puna
        POSTGRES_DB: puna
  variables:
    # --- THE CPU LIMIT IS LOAD-BEARING HERE, MORE THAN ON ANY BUILD JOB ------------------------------
    # A long nightly asking for eight CPUs looks impolite, and removing this block is the obvious
    # courtesy. Do not: `available_parallelism()` reads the cgroup CPU QUOTA, which comes from the
    # limit -- the same mechanism the anchor above describes for cargo's build parallelism -- and the
    # Rust test harness picks its THREAD COUNT from that call. So the limit is how many tests run at
    # once, which is the variable a concurrency race is sensitive to.
    #
    # The one race this repository has found needed exactly that: the metrics-registry flake measured
    # 2 failures in 60 runs of the whole lib and **0 in 40 of the suspect module alone**. It could
    # only lose with enough other tests in flight. Cut the CPUs and this job still runs fifty times,
    # still reports a rate, still passes -- and quietly stops being able to find the thing it exists
    # for, which is the failure mode it was written to catch.
    #
    # There is a duller reason too: the loop is preceded by one full `--no-run` compile, and at a
    # small default that alone can approach the timeout on a job that then wants ten minutes of
    # tests. It runs at night with `interruptible: false`, so it is not competing with anyone.
    <<: *k8s-resources
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    DATABASE_URL: postgres://puna:puna@postgres:5432/puna
    # Same reasoning as the `check` job: without this a missing service turns most of the coverage
    # into a skip that reports ok, which in THIS job would mean hunting flakes in tests that never
    # ran.
    PUNA_REQUIRE_DB_TESTS: "1"
    FLAKE_HUNT_RUNS: "50"
  script:
    # Compiled once, so the loop below times the tests rather than the build -- and so a genuine
    # compile failure is reported as one instead of as fifty test failures.
    - cargo test --workspace --no-run
    - |
      echo "running the workspace suite $FLAKE_HUNT_RUNS times"
      failures=0
      for i in $(seq 1 "$FLAKE_HUNT_RUNS"); do
        if cargo test --workspace > "/tmp/flake-run-$i.log" 2>&1; then
          printf '.'
        else
          failures=$((failures + 1))
          printf '\n=== run %s of %s FAILED ===\n' "$i" "$FLAKE_HUNT_RUNS"
          # The lines that identify it, not the whole log: a workspace run is hundreds of lines
          # and about twenty of them say which test died and why.
          grep -E '^test .* FAILED|panicked at|^test result: FAILED' "/tmp/flake-run-$i.log" \
            || tail -40 "/tmp/flake-run-$i.log"
        fi
      done
      printf '\n%s failure(s) in %s runs\n' "$failures" "$FLAKE_HUNT_RUNS"
      if [ "$failures" -ne 0 ]; then
        echo
        echo "A test that fails intermittently is worse than one that fails: the pipeline goes"
        echo "green on a re-run and nobody looks again. Fix the test, then confirm with an A/B --"
        echo "run it this many times before and after, and compare the rates."
        exit 1
      fi
      echo "no intermittent failures"

# ---- rust-build stage ----

build-puna-web:
  <<: *rust-env
  <<: *always
  stage: rust-build
  variables:
    <<: *k8s-resources
    # Repeated because this block REPLACES the one inherited from `.rust-cache`; without it the
    # registry cache would be written somewhere `cache:` does not collect.
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  script:
    - cargo build --release --bin puna-web
    - mkdir -p artifacts/puna-web
    - cp target/release/puna-web artifacts/puna-web/build-result
  artifacts:
    paths: [artifacts/puna-web/]
    expire_in: 1 day

build-puna-orchestrator:
  <<: *rust-env
  <<: *always
  stage: rust-build
  variables:
    <<: *k8s-resources
    # See build-puna-web: this block replaces the inherited one, so CARGO_HOME is restated.
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  script:
    - cargo build --release --bin puna-orchestrator
    - mkdir -p artifacts/puna-orchestrator
    - cp target/release/puna-orchestrator artifacts/puna-orchestrator/build-result
  artifacts:
    paths: [artifacts/puna-orchestrator/]
    expire_in: 1 day

# ---- image stage ----

image-puna-web:
  <<: *buildah-build
  <<: *always
  needs: [build-puna-web]
  script:
    - cp artifacts/puna-web/build-result deploy/puna-web/build-result
    - buildah build -f deploy/puna-web/Dockerfile
        -t "$CI_REGISTRY_IMAGE/puna-web:sha-$CI_COMMIT_SHORT_SHA" deploy/puna-web
    - push_image "$CI_REGISTRY_IMAGE/puna-web"

image-puna-orchestrator:
  <<: *buildah-build
  <<: *always
  needs: [build-puna-orchestrator]
  script:
    - cp artifacts/puna-orchestrator/build-result deploy/puna-orchestrator/build-result
    - buildah build -f deploy/puna-orchestrator/Dockerfile
        -t "$CI_REGISTRY_IMAGE/puna-orchestrator:sha-$CI_COMMIT_SHORT_SHA" deploy/puna-orchestrator
    - push_image "$CI_REGISTRY_IMAGE/puna-orchestrator"
