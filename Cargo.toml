[workspace]
resolver = "3"
members = [
    "puna-core",
    "puna-web",
    "puna-orchestrator",
]

# There is deliberately NO [patch.crates-io] block here.
#
# The sibling Archipelago-lobby workspace patches rocket, rocket_ws, rocket_prometheus,
# rocket_oauth2, figment, sentry and sentry-tracing to forks. Puna takes none of them, and
# each omission was checked rather than assumed:
#
#   rocket             the fork is 0.5.1 plus Sentry/OTLP hub-per-request plumbing. Puna
#                      installs neither Sentry nor OTLP, so the delta is dead weight here.
#   rocket_prometheus  forked, and replaced outright: Puna's request metrics are a ~20-line
#                      fairing over the `prometheus` crate.
#   figment            not really a fork -- the branch is upstream master ahead of the
#                      0.10.19 release. The introspection API Puna uses to read the Discord
#                      config out of Rocket.toml is long-standing core figment.
#   sentry*            unused.
#
# rocket_oauth2 is the one that mattered: see puna-web/Cargo.toml.

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
puna-core = { path = "puna-core" }

# The multidata parser, taken from pahoa rather than reimplemented: it is a Python pickle reader
# with an allowlist and a bit-exact MT19937, and a second implementation would be a second set of
# bugs. Puna parses a generation at UPLOAD time so a bad seed is a 400 on the form rather than a
# crashlooping room pod.
#
# Pinned to a rev, and fetched over ANONYMOUS HTTPS from git.mooinglemur.com -- the GitLab mirror
# is public while the GitHub origin stays private during early development, so CI needs no
# credentials for this. Bump the rev deliberately; pahoa changing must never silently change how
# Puna reads a seed.
pahoa-multidata = { git = "https://git.mooinglemur.com/mooinglemur/pahoa.git", rev = "03aad14bf38e39ebaf5aa6486ade55668d049597" }

anyhow = "1.0"
async-trait = "0.1"
# Both binaries serve an unauthenticated /metrics (and, in the orchestrator, /healthz and /readyz)
# on a side listener that Rocket has no business owning. Pinned here rather than per-crate so the
# two cannot drift onto different axum majors while serving what is meant to be one scrape shape.
axum = "0.8"
# Here for the same reason as axum, and with more at stake. Two crates now dial rooms -- the
# tracker tier for its documents and the orchestrator for its probe -- and reqwest's default
# features route through `default-tls` -> `rustls` -> `__rustls-aws-lc-rs`, which is the single
# largest source of the aws-lc-rs provider. `rustls-no-provider` gives the same rustls stack
# (including rustls-platform-verifier for roots) while leaving the provider choice to the
# workspace's rustls pin, i.e. ring. The three non-TLS defaults are re-stated because
# default-features = false drops them too.
#
# Declared once so the two cannot drift: with two providers compiled in, rustls cannot infer a
# process default and `ClientConfig::builder()` PANICS at runtime. `grep -c 'name = "aws-lc'
# Cargo.lock` must stay 0.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "rustls-no-provider",
    "json",
    "form",
    "multipart",
] }
chrono = { version = "0.4", features = ["serde"] }
prometheus = { version = "0.14", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Database. Mirrors the versions Archipelago-lobby's `common` crate uses, since
# puna-core/src/db.rs is vendored from it.
deadpool = "0.13"
# 64-column-tables is required, not optional: `rooms` has 46 columns and diesel's `table!`
# macro supports 32 by default. That width is a direct consequence of the desired/observed
# split -- one row carries what the web tier requests and what the orchestrator observed --
# and splitting the table to dodge the limit would put a join on the hottest read path.
# The cost is diesel's macro expansion getting slower; measured at well under a second here.
#
# Note there is no "postgres" feature: Puna reaches Postgres through diesel-async ->
# tokio-postgres, pure Rust. diesel-async enables `postgres_backend` (the types) without the
# libpq-linked connection, which is why the binaries link no libpq at all.
diesel = { version = "2.3.5", features = ["uuid", "chrono", "serde_json", "64-column-tables"] }
diesel-async = { version = "0.8", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
futures-util = "0.3"
# default-features = false is load-bearing, not tidiness. rustls 0.23's default features
# include the aws-lc-rs provider, so `features = ["ring"]` alone enables BOTH providers --
# and with two providers compiled in, rustls cannot infer a process-level default, so
# `ClientConfig::builder()` panics at runtime unless install_default() ran first. Exactly one
# provider must be enabled. ring is the choice because the vendored db.rs installs it by name
# and because it avoids aws-lc-sys, which needs a C toolchain and cmake at build time.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.8"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"

[profile.release]
# Symbols kept deliberately: a backtrace out of a container is worth more than the
# few MB, and these images are not distributed.
debug = 1
