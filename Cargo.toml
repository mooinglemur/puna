[workspace]
resolver = "3"
members = [
    "puna-core",
    "puna-web",
    "puna-orchestrator",
    # Dev tools, not a shipped tier. The release jobs build `--bin puna-web` and
    # `--bin puna-orchestrator` by name (.gitlab-ci.yml), so nothing here reaches either image --
    # while `cargo clippy --workspace --all-targets -- -D warnings` and `cargo test --workspace`
    # still cover it, which is the bar a pickle encoder should be held to.
    "puna-tools",
]

# There is deliberately NO [patch.crates-io] block here.
#
# The sibling Archipelago-lobby workspace patches rocket, rocket_ws, rocket_prometheus,
# rocket_oauth2, figment, sentry and sentry-tracing to forks. Puna takes none of them, and
# each omission was checked rather than assumed:
#
#   rocket             the fork is 0.5.1 plus Sentry/OTLP hub-per-request plumbing. Puna
#                      installs neither Sentry nor OTLP, so the delta is dead weight here.
#   rocket_prometheus  forked, and replaced outright: Puna's request metrics are a ~20-line
#                      fairing over the `prometheus` crate.
#   figment            not really a fork -- the branch is upstream master ahead of the
#                      0.10.19 release. The introspection API Puna uses to read the Discord
#                      config out of Rocket.toml is long-standing core figment.
#   sentry*            unused.
#
# rocket_oauth2 is the one that mattered: see puna-web/Cargo.toml.

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
puna-core = { path = "puna-core" }

# The multidata parser, taken from pahoa rather than reimplemented: it is a Python pickle reader
# with an allowlist and a bit-exact MT19937, and a second implementation would be a second set of
# bugs. Puna parses a generation at UPLOAD time so a bad seed is a 400 on the form rather than a
# crashlooping room pod.
#
# Pinned to a rev, and fetched over ANONYMOUS HTTPS from git.mooinglemur.com -- the GitLab mirror
# is public while the GitHub origin stays private during early development, so CI needs no
# credentials for this. Bump the rev deliberately; pahoa changing must never silently change how
# Puna reads a seed.
#
# Bumped 03aad14b -> e810ae8a for `MultiData::validate`, which pahoa now RUNS ON THE SERVE PATH
# before the port binds -- so from that image on, a seed failing it is a room that exits at
# startup instead of one that comes up and misbehaves. Puna runs the same function at upload so
# that refusal is a 400 on the form. The delta to this crate's API is purely additive (`ONLY_TEAM`,
# `teams`, `team_slots`, `ClientStatus::from_text`), and the one behavioral change is a fix Puna
# wants: the locations check counts DECLARED slot ids, so a seed with a spectator in it is no
# longer read as having a hole. All 14 corpus zips parse and validate identically across the bump.
#
# Bumped e810ae8a -> f3275941 for `pahoa-net`'s client below. Nothing under `crates/pahoa-multidata`
# or `crates/pahoa-pickle` changed in that range -- `git diff --stat` over those two paths is empty
# -- so how Puna reads a seed is byte-for-byte what it was.
pahoa-multidata = { git = "https://git.mooinglemur.com/mooinglemur/pahoa.git", rev = "f327594149dccee2bec2ff389c1904a493927d90" }
# The untyped layer under `pahoa-multidata`, taken directly so `puna-tools` can BUILD a `PyObj`
# tree and write it back out as pickle. **The rev must equal the one above** -- two revs would mean
# two incompatible `PyObj` types in one graph, and the error would be about a trait not being
# implemented rather than about a version skew.
pahoa-pickle = { git = "https://git.mooinglemur.com/mooinglemur/pahoa.git", rev = "f327594149dccee2bec2ff389c1904a493927d90" }
# pahoa's WebSocket layer, for `puna-tools` alone -- **the only client anywhere that negotiates
# permessage-deflate against a pahoa room.** `tungstenite` rejects a frame with RSV1 set outright
# (`protocol/mod.rs:643`), so a load run through it is a population the room can share no
# compression with, and every outbound byte it measures is a worst case.
#
# Same rev as the two above, and it must stay that way: this crate depends on `pahoa-multidata`
# itself, so a second rev would put two copies of the seed parser in one graph.
#
# It is a load-tool dependency and reaches no shipped tier -- `puna-core` and the two binaries do
# not name it.
pahoa-net = { git = "https://git.mooinglemur.com/mooinglemur/pahoa.git", rev = "f327594149dccee2bec2ff389c1904a493927d90" }

anyhow = "1.0"
async-trait = "0.1"
# Both binaries serve an unauthenticated /metrics (and, in the orchestrator, /healthz and /readyz)
# on a side listener that Rocket has no business owning. Pinned here rather than per-crate so the
# two cannot drift onto different axum majors while serving what is meant to be one scrape shape.
axum = "0.8"
# Here for the same reason as axum, and with more at stake. Two crates now dial rooms -- the
# tracker tier for its documents and the orchestrator for its probe -- and reqwest's default
# features route through `default-tls` -> `rustls` -> `__rustls-aws-lc-rs`, which is the single
# largest source of the aws-lc-rs provider. `rustls-no-provider` gives the same rustls stack
# (including rustls-platform-verifier for roots) while leaving the provider choice to the
# workspace's rustls pin, i.e. ring. The three non-TLS defaults are re-stated because
# default-features = false drops them too.
#
# Declared once so the two cannot drift: with two providers compiled in, rustls cannot infer a
# process default and `ClientConfig::builder()` PANICS at runtime. `grep -c 'name = "aws-lc'
# Cargo.lock` must stay 0.
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "system-proxy",
    "rustls-no-provider",
    "json",
    "form",
    "multipart",
] }
chrono = { version = "0.4", features = ["serde"] }
prometheus = { version = "0.14", default-features = false }
# Reads a ROOM's exposition so the orchestrator can re-export it with `room` attached. Parsing
# rather than rewriting lines is what keeps a room from being able to break the orchestrator's own
# `/metrics`: whatever comes back is turned into structured samples and re-emitted, so a malformed
# document costs that room its series and nothing else. See `puna_core::metrics::proxy`.
prometheus-parse = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Database. Mirrors the versions Archipelago-lobby's `common` crate uses, since
# puna-core/src/db.rs is vendored from it.
deadpool = "0.13"
# 64-column-tables is required, not optional: `rooms` has 46 columns and diesel's `table!`
# macro supports 32 by default. That width is a direct consequence of the desired/observed
# split -- one row carries what the web tier requests and what the orchestrator observed --
# and splitting the table to dodge the limit would put a join on the hottest read path.
# The cost is diesel's macro expansion getting slower; measured at well under a second here.
#
# Note there is no "postgres" feature: Puna reaches Postgres through diesel-async ->
# tokio-postgres, pure Rust. diesel-async enables `postgres_backend` (the types) without the
# libpq-linked connection, which is why the binaries link no libpq at all.
diesel = { version = "2.3.5", features = ["uuid", "chrono", "serde_json", "64-column-tables"] }
diesel-async = { version = "0.8", features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
futures-util = "0.3"
# default-features = false is load-bearing, not tidiness. rustls 0.23's default features
# include the aws-lc-rs provider, so `features = ["ring"]` alone enables BOTH providers --
# and with two providers compiled in, rustls cannot infer a process-level default, so
# `ClientConfig::builder()` panics at runtime unless install_default() ran first. Exactly one
# provider must be enabled. ring is the choice because the vendored db.rs installs it by name
# and because it avoids aws-lc-sys, which needs a C toolchain and cmake at build time.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.8"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
# `puna-tools`' load generator only, so this never reaches a shipped image -- but it is declared
# here because of what its DEFAULT features would do. `tungstenite`'s own `rustls` feature pulls
# rustls with defaults on, which enables aws-lc-rs; feature unification would then compile BOTH
# providers into anything sharing the graph, and rustls cannot infer a process default with two --
# `ClientConfig::builder()` panics at runtime. `default-features = false` plus the webpki-roots
# feature keeps it on ring, verified the same way as everything else here:
# `grep -c 'name = "aws-lc' Cargo.lock` must stay 0.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
    "stream",
    "rustls-tls-webpki-roots",
] }

[profile.release]
# Symbols kept deliberately: a backtrace out of a container is worth more than the
# few MB, and these images are not distributed.
debug = 1
