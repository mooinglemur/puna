[package]
name = "puna-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
puna-core.workspace = true

anyhow.workspace = true
chrono.workspace = true
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

diesel.workspace = true
diesel-async.workspace = true

# For the unauthenticated /metrics listener on :9090 only -- see src/metrics_listener.rs. Rocket
# already serves this process's public port; axum is here because that port's /metrics is behind a
# session-cookie guard a scrape cannot satisfy, and because puna-orchestrator already solved the
# same problem this way. A second Rocket would drag in a second figment, a second secret key and a
# second set of signal handlers for one route.
axum.workspace = true
askama = { version = "0.15", features = ["serde_json"] }
askama_web = { version = "0.15", features = ["rocket-0.5"] }
reqwest.workspace = true
rocket = { version = "0.5.1", features = ["json", "secrets", "uuid"] }
rust-embed = { version = "8", features = ["rocket"] }
zip = "7"

# 0.5.1-rc.1, and the pre-release MUST be written out in full.
#
# Cargo will not select a pre-release from a "0.5" or "0.5.1" requirement, so a shortened spec
# silently resolves back to 0.5.0 -- whose `Debug for OAuthConfig` prints client_secret in the
# clear. One `tracing::debug!("{:?}", ..)` or anyhow chain away from the Discord secret landing
# in a container log, and nothing about the failure looks like a failure.
#
# 0.5.1-rc.1 redacts it (`.field("client_secret", &(..))`, verified in the published crate) and
# additionally modernises base64 0.22 / hyper-rustls 0.27 / rand 0.10, keeping second copies of
# those out of the tree. `Discord` remains a built-in provider, so Rocket.toml is unchanged.
rocket_oauth2 = "0.5.1-rc.1"
rocket_ws = "0.1.1"
flate2 = "1.1.9"

[build-dependencies]
sha2 = "0.10"
walkdir = "2"

# The Postgres harness in src/testdb.rs, and nothing else. It creates and drops a scratch database
# per test, which needs a raw connection for `CREATE DATABASE` (diesel-async's pool cannot run it),
# and catches a panic so the drop still happens.
#
# **A `#[cfg(test)]` module rather than tests/, because this is a binary crate**: an integration
# test links a library, and there is none here -- the same reason puna-orchestrator has its own.
[dev-dependencies]
futures-util.workspace = true
# Tests only, to install the process-wide crypto provider before building a reqwest client.
#
# `main` never needs this: the database pool is built at startup and puna-core installs ring on the
# way through, so every client built afterwards finds one. A unit test has no pool, and reqwest's
# `rustls-no-provider` feature PANICS rather than auto-installing -- so a test that builds a client
# must do explicitly what startup does implicitly. Workspace-pinned, so it cannot select a second
# provider and reintroduce the ambiguity that pin exists to remove.
rustls.workspace = true
tempfile = "3.27.0"
tokio-postgres.workspace = true
